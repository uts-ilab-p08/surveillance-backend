# Local dev only. In staging/prod, the DB_* fields in .env point at the
# shared Supabase project instead and this file isn't used. Plain Postgres —
# this repo doesn't need the pgvector extension, since embeddings/vector
# search live in the RAG team's own service, not here.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surveillance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Stubs a minimal auth.users table so app.saved_queries/recent_queries'
      # FK to auth.users(id) can exist locally too — see db-init/'s own
      # comment for why. Only runs on first container init (empty pgdata
      # volume); `docker compose down -v` + `up -d` re-applies it.
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  pgdata:
